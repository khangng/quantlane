[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# service worker & manifest không cache lâu để cập nhật kịp thời
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# index.html ở thư mục gốc sẽ tự được serve tại "/"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/dashboard-core.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/dashboard.css"
  [headers.values]
    Cache-Control = "no-cache"
